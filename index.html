<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Silownia" />
    <meta name="format-detection" content="telephone=no" />

    <title>Silownia</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="120x120" href="icons/icon.svg" />

    <link rel="preload" href="styles.css" as="style" />
    <link rel="preload" href="app.js" as="script" />
    <link rel="stylesheet" href="styles.css" />

    <style>
      html, body {
        background: #0a0a0a;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #ffffff;
        z-index: 9999;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      #boot-splash strong { font-size: 22px; letter-spacing: 0.04em; }
      #boot-splash small { color: #8e8e93; font-size: 12px; }
      #boot-error {
        display: none;
        max-width: 460px;
        margin: 0 auto;
        padding: 20px;
        background: #1c1c1e;
        border: 1px solid #ff453a;
        border-radius: 14px;
        text-align: left;
      }
      #boot-error h2 { color: #ff453a; margin: 0 0 8px; font-size: 16px; }
      #boot-error pre {
        background: #000;
        color: #ff9d2e;
        padding: 12px;
        border-radius: 8px;
        font-size: 11px;
        overflow: auto;
        max-height: 240px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot-error button {
        margin-top: 12px;
        background: #ffffff;
        color: #000;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite">
      <strong>Silownia</strong>
      <small>Ładowanie…</small>
      <div id="boot-error" role="alert">
        <h2>Błąd uruchomienia</h2>
        <pre id="boot-error-msg"></pre>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <div id="app" class="app-shell" aria-live="polite"></div>
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        var errBox = document.getElementById("boot-error");
        var errMsg = document.getElementById("boot-error-msg");
        function showError(msg) {
          if (errBox && errMsg) {
            errMsg.textContent = String(msg || "Unknown error");
            errBox.style.display = "block";
          }
        }
        window.addEventListener("error", function (e) {
          showError((e.message || "Error") + "\n" + (e.filename || "") + ":" + (e.lineno || "") + "\n\n" + (e.error && e.error.stack ? e.error.stack : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          showError("UnhandledRejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        window.__hideBootSplash = function () {
          if (splash && !errBox.style.display) splash.remove();
        };
        setTimeout(function () {
          var app = document.getElementById("app");
          if (app && app.children.length > 0 && !errBox.style.display) {
            if (splash) splash.remove();
          }
        }, 1500);
      })();
    </script>
    <script src="app.js"></script>
  </body>
</html>
